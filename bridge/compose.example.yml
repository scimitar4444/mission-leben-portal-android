services:
  ntfy:
    image: docker.io/binwiederhier/ntfy:v2.28.0@sha256:f8060a494b69d53866ef505c36a205efcce3204618d6e183a87128cca6e7cac9
    command: ["serve"]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      NTFY_BASE_URL: https://push.mission-leben.de
      NTFY_LISTEN_HTTP: :2586
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 1h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "false"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_BEHIND_PROXY: "true"
      NTFY_KEEPALIVE_INTERVAL: 45s
    ports:
      - "127.0.0.1:2586:2586"
    volumes:
      - ./ntfy-data:/var/lib/ntfy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2586/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      ntfy:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "geraete.mission-leben.de:host-gateway"
    volumes:
      - ./data:/data
      - ./ntfy-data:/ntfy
      - ./directory-data:/run/mission-leben-directory:ro
      - ./secrets/nextcloud-talk-bot-secret:/run/secrets/nextcloud-talk-bot-secret:ro
      - ./secrets/nextcloud-announcements-secret:/run/secrets/nextcloud-announcements-secret:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  zimbra-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "mission_leben_bridge.zimbra_worker"]
    env_file: .env
    depends_on:
      bridge:
        condition: service_healthy
    volumes:
      - ./secrets/zimbra-admin-password:/run/secrets/zimbra-admin-password:ro
      - ./secrets/zimbra-account-map.json:/run/secrets/zimbra-account-map.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,time; p=pathlib.Path('/tmp/zimbra-worker-heartbeat'); raise SystemExit(0 if p.is_file() and time.time()-p.stat().st_mtime < 180 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  preflight:
    profiles: ["tools"]
    build: .
    command: ["mission-leben-bridge-preflight", "--require", "login_approval,ntfy,zimbra,talk,announcements"]
    env_file: .env
    volumes:
      - ./ntfy-data:/ntfy
      - ./secrets/nextcloud-talk-bot-secret:/run/secrets/nextcloud-talk-bot-secret:ro
      - ./secrets/nextcloud-announcements-secret:/run/secrets/nextcloud-announcements-secret:ro
      - ./secrets/zimbra-admin-password:/run/secrets/zimbra-admin-password:ro
      - ./secrets/zimbra-account-map.json:/run/secrets/zimbra-account-map.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
