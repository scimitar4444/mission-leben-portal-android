services:
  bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./secrets/nextcloud-talk-bot-secret:/run/secrets/nextcloud-talk-bot-secret:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  zimbra-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "mission_leben_bridge.zimbra_worker"]
    env_file: .env
    depends_on:
      bridge:
        condition: service_healthy
    volumes:
      - ./secrets/zimbra-admin-password:/run/secrets/zimbra-admin-password:ro
      - ./secrets/zimbra-account-map.json:/run/secrets/zimbra-account-map.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  preflight:
    profiles: ["tools"]
    build: .
    command: ["mission-leben-bridge-preflight", "--require", "login_approval,fcm,zimbra,talk"]
    env_file: .env
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./secrets/nextcloud-talk-bot-secret:/run/secrets/nextcloud-talk-bot-secret:ro
      - ./secrets/zimbra-admin-password:/run/secrets/zimbra-admin-password:ro
      - ./secrets/zimbra-account-map.json:/run/secrets/zimbra-account-map.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
