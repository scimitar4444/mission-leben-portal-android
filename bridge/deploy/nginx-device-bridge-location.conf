# Insert these locations into the existing id.mission-leben.de TLS server block.
# Only the mobile API, health endpoint and Authentik-signed authentication API
# are public. /auth/v2/* is not an end-user endpoint and rejects unsigned calls.
location ~ ^/auth/v2/(ping|check|auth)$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Server;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
}

location /auth/v2/ {
    return 404;
}

location = /device-bridge/healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Server;
}

location ^~ /device-bridge/v1/ {
    proxy_pass http://127.0.0.1:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Server;
    client_max_body_size 80k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

# Native Nextcloud Talk bot webhook. This route is intentionally reachable
# only from the current Nextcloud host; the Bridge additionally verifies the
# Talk HMAC signature, backend header and replay nonce.
location = /device-bridge/sources/nextcloud-talk {
    allow 172.16.40.140;
    deny all;
    limit_except POST {
        deny all;
    }
    proxy_pass http://127.0.0.1:8080/sources/nextcloud-talk;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Server;
    client_max_body_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

location ^~ /device-bridge/ {
    return 404;
}
