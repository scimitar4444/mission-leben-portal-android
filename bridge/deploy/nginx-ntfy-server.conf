# Dedicated TLS host for the embedded Mission Leben push transport.
# The wildcard certificate already covers push.mission-leben.de.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name push.mission-leben.de;

    # Reuse the wildcard certificate paths from the existing Mission Leben hosts.
    ssl_certificate /etc/letsencrypt/live/mission-leben.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mission-leben.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3m;
        client_max_body_size 16k;
    }
}
