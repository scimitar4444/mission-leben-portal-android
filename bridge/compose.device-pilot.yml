services:
  bridge:
    build: .
    container_name: mission-leben-device-bridge
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "geraete.mission-leben.de:host-gateway"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
