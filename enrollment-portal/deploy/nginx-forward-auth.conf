# Example vhost. TLS certificate and the actual authentik/outpost upstream must
# match the Mission Leben reverse-proxy deployment.
upstream mission_leben_device_enrollment {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream authentik_embedded_outpost {
    server 127.0.0.1:9000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=device_enrollment_redeem:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name geraete.mission-leben.de;

    # Never forward caller-supplied identity headers. Only variables copied
    # from the authentik auth subrequest are sent to the portal below.
    location = /healthz {
        proxy_pass http://mission_leben_device_enrollment;
        proxy_set_header X-Authentik-Username "";
        proxy_set_header X-Authentik-Groups "";
        proxy_set_header X-Authentik-Email "";
        proxy_set_header X-Authentik-Name "";
        proxy_set_header X-Authentik-Uid "";
        proxy_set_header X-Authentik-Meta-App "";
    }

    location ~ ^/api/v1/enrollments/[0-9a-fA-F-]{36}/redeem$ {
        limit_except POST { deny all; }
        limit_req zone=device_enrollment_redeem burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://mission_leben_device_enrollment;
        proxy_set_header X-Authentik-Username "";
        proxy_set_header X-Authentik-Groups "";
        proxy_set_header X-Authentik-Email "";
        proxy_set_header X-Authentik-Name "";
        proxy_set_header X-Authentik-Uid "";
        proxy_set_header X-Authentik-Meta-App "";
    }

    location /outpost.goauthentik.io {
        proxy_pass http://authentik_embedded_outpost;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }

    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        auth_request_set $ak_username $upstream_http_x_authentik_username;
        auth_request_set $ak_groups $upstream_http_x_authentik_groups;
        auth_request_set $ak_email $upstream_http_x_authentik_email;
        auth_request_set $ak_name $upstream_http_x_authentik_name;
        auth_request_set $ak_uid $upstream_http_x_authentik_uid;
        auth_request_set $ak_meta_app $upstream_http_x_authentik_meta_app;

        proxy_pass http://mission_leben_device_enrollment;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Authentik-Username $ak_username;
        proxy_set_header X-Authentik-Groups $ak_groups;
        proxy_set_header X-Authentik-Email $ak_email;
        proxy_set_header X-Authentik-Name $ak_name;
        proxy_set_header X-Authentik-Uid $ak_uid;
        proxy_set_header X-Authentik-Meta-App $ak_meta_app;
    }
}
