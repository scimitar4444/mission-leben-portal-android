services:
  device-enrollment:
    build: .
    container_name: mission-leben-device-enrollment
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8081:8080"
    secrets:
      - authentik_enrollment_api_token
      - enrollment_csrf_secret
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  authentik_enrollment_api_token:
    file: ./secrets/authentik-enrollment-api-token
  enrollment_csrf_secret:
    file: ./secrets/csrf-secret
