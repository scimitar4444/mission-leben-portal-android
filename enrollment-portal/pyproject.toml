[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-leben-device-enrollment"
version = "0.2.0"
description = "Stateless, Authentik-backed device initialization portal for Mission Leben Zentral"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "segno>=1.6,<2",
    "tzdata>=2026.1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[project.scripts]
mission-leben-device-enrollment = "mission_leben_device_enrollment.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mission_leben_device_enrollment = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
