name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: mission-leben-portal-debug
          path: app/build/outputs/apk/debug/*.apk

  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bridge/pyproject.toml
      - name: Install bridge
        run: python -m pip install ./bridge
      - name: Test bridge
        run: PYTHONPATH=bridge/src python -W error::ResourceWarning -m unittest discover -s bridge/tests -v
